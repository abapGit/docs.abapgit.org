<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="330" viewBox="0 0 1080 330" role="img" aria-labelledby="title desc">
  <title id="title">Suggested approach for adding AFF support</title>
  <desc id="desc">A four-stage flow reads legacy XML into an AFF interface structure, persists the SAP object, and serializes it as AFF JSON while preserving backwards compatibility.</desc>

  <defs>
    <filter id="shadow" x="-10%" y="-15%" width="120%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#362701" flood-opacity="0.14" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b625d" />
    </marker>
    <style>
      .heading { font: 700 22px Arial, Helvetica, sans-serif; fill: #362701; }
      .label { font: 700 16px Arial, Helvetica, sans-serif; fill: #362701; }
      .detail { font: 14px Arial, Helvetica, sans-serif; fill: #5c514b; }
      .code { font: 700 24px Consolas, "Liberation Mono", monospace; fill: #362701; }
      .step { font: 700 13px Arial, Helvetica, sans-serif; fill: #ffffff; letter-spacing: 0.2px; }
      .arrow { stroke: #6b625d; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <text class="heading" x="540" y="34" text-anchor="middle">Backwards-compatible migration to AFF</text>

  <g filter="url(#shadow)">
    <rect x="25" y="76" width="210" height="142" rx="12" fill="#fff4f2" stroke="#f03c2e" stroke-width="2" />
    <rect x="305" y="76" width="210" height="142" rx="12" fill="#fff9e8" stroke="#d99b16" stroke-width="2" />
    <rect x="585" y="76" width="210" height="142" rx="12" fill="#eef7ff" stroke="#397aa8" stroke-width="2" />
    <rect x="865" y="76" width="190" height="142" rx="12" fill="#eef9f1" stroke="#36834b" stroke-width="2" />
  </g>

  <text class="code" x="130" y="119" text-anchor="middle">&lt;XML /&gt;</text>
  <text class="label" x="130" y="153" text-anchor="middle">Legacy abapGit file</text>
  <text class="detail" x="130" y="181" text-anchor="middle">Keep readable</text>
  <text class="detail" x="130" y="201" text-anchor="middle">for existing repositories</text>

  <text class="code" x="410" y="119" text-anchor="middle">{ AFF }</text>
  <text class="label" x="410" y="153" text-anchor="middle">INTF data structure</text>
  <text class="detail" x="410" y="181" text-anchor="middle">Map every field</text>
  <text class="detail" x="410" y="201" text-anchor="middle">without data loss</text>

  <g transform="translate(666 101)" fill="none" stroke="#397aa8" stroke-width="2.5">
    <ellipse cx="24" cy="8" rx="24" ry="8" fill="#dceffc" />
    <path d="M0 8v28c0 4 11 8 24 8s24-4 24-8V8" fill="#dceffc" />
    <path d="M0 22c0 4 11 8 24 8s24-4 24-8" />
  </g>
  <text class="label" x="690" y="167" text-anchor="middle">SAP object</text>
  <text class="detail" x="690" y="193" text-anchor="middle">Create or update</text>

  <text class="code" x="960" y="119" text-anchor="middle">{ JSON }</text>
  <text class="label" x="960" y="153" text-anchor="middle">AFF file</text>
  <text class="detail" x="960" y="181" text-anchor="middle">Write the new</text>
  <text class="detail" x="960" y="201" text-anchor="middle">canonical format</text>

  <path class="arrow" d="M235 147 H292" />
  <path class="arrow" d="M515 147 H572" />
  <path class="arrow" d="M795 147 H852" />

  <g>
    <rect x="242" y="116" width="44" height="22" rx="11" fill="#f03c2e" />
    <text class="step" x="264" y="132" text-anchor="middle">READ</text>
    <rect x="522" y="116" width="44" height="22" rx="11" fill="#d18a00" />
    <text class="step" x="544" y="132" text-anchor="middle">SAVE</text>
    <rect x="802" y="116" width="44" height="22" rx="11" fill="#36834b" />
    <text class="step" x="824" y="132" text-anchor="middle">WRITE</text>
  </g>

  <path d="M25 254 v12 q0 12 12 12 h1006 q12 0 12-12 v-12" fill="none" stroke="#f03c2e" stroke-width="2" />
  <rect x="323" y="254" width="434" height="48" rx="24" fill="#ffffff" stroke="#f03c2e" stroke-width="2" />
  <text class="label" x="540" y="275" text-anchor="middle">Compatibility guarantee</text>
  <text class="detail" x="540" y="294" text-anchor="middle">Read old formats · write AFF · preserve all data</text>
</svg>
